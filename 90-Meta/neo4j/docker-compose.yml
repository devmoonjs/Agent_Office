services:
  neo4j:
    image: neo4j:5-community
    container_name: jarvis-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:57474:7474"   # HTTP (Browser UI) — 로컬호스트만 바인딩
      - "127.0.0.1:57687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # 주의: NEO4J_ 접두사 변수는 이미지가 neo4j.conf 설정으로 변환하므로
      # healthcheck용 비밀번호는 다른 접두사를 사용한다
      - HC_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ./data:/data
      - ./logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${HC_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
