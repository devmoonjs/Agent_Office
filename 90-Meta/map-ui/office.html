<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office</title>
<script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<style>
:root{--sb:#171717;--bg:#0f0f0f;--sel:#262626;--hover:#1f1f1f;--bub:#1c1c1c;--bub-user:#2a2a2a;--line:#232323;--panel:#141414;
 --tx:#ececec;--tx2:#9a9a9a;--tx3:#6a6a6a;--pill:#1a1a1a;--ok:#6fcf97;--warn:#e0a24a;--bad:#e06a6a;
 --chip:#202020;--field:#232323;--code:#2a2a2a;--codeblock:#0b0b0b;--pri:#ececec;--pri-fg:#111;--modal:#181818;--modal-line:#2a2a2a;--focus:#555;--scroll:#333;--face:#0f0f0f;--shot:#0b0f16;--shot-line:#1f2733;
 --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;--mono:ui-monospace,Menlo,monospace;color-scheme:dark}
:root[data-theme="light"]{--sb:#f4f4f5;--bg:#ffffff;--sel:#e4e4e7;--hover:#ececee;--bub:#f1f1f3;--bub-user:#e4e4e7;--line:#e5e5e8;--panel:#f6f6f7;
 --tx:#18181b;--tx2:#5f6368;--tx3:#9a9ca3;--pill:#f4f4f5;--ok:#2f9e5f;--warn:#b8791a;--bad:#c94a4a;
 --chip:#ebebee;--field:#e9e9ec;--code:#e6e6ea;--codeblock:#f4f4f5;--pri:#18181b;--pri-fg:#fff;--modal:#ffffff;--modal-line:#e5e5e8;--focus:#999;--scroll:#c8c8cc;--face:#ffffff;--shot:#f7f8fa;--shot-line:#e2e5ea;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--sb:#f4f4f5;--bg:#ffffff;--sel:#e4e4e7;--hover:#ececee;--bub:#f1f1f3;--bub-user:#e4e4e7;--line:#e5e5e8;--panel:#f6f6f7;
 --tx:#18181b;--tx2:#5f6368;--tx3:#9a9ca3;--pill:#f4f4f5;--ok:#2f9e5f;--warn:#b8791a;--bad:#c94a4a;
 --chip:#ebebee;--field:#e9e9ec;--code:#e6e6ea;--codeblock:#f4f4f5;--pri:#18181b;--pri-fg:#fff;--modal:#ffffff;--modal-line:#e5e5e8;--focus:#999;--scroll:#c8c8cc;--face:#ffffff;--shot:#f7f8fa;--shot-line:#e2e5ea;color-scheme:light}}
/* 스크롤바 — 배경과 같은 계열의 얇은 바 */
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:padding-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:minmax(0,1fr);height:100vh}
.app>*{min-height:0;max-height:100vh}
.app.drawer{grid-template-columns:272px 1fr 320px}
/* ── 사이드바 ── */
.sb{background:var(--sb);display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.sb-top b{font-size:13px;color:var(--tx2);font-weight:600;cursor:pointer;border-radius:6px;padding:2px 6px;margin-left:-6px}.sb-top b:hover{color:var(--tx);background:var(--hover)}
.plus{background:none;border:0;color:var(--tx2);font-size:22px;line-height:1;padding:0 4px}
.plus:hover{color:var(--tx)}
.search{margin:2px 12px 8px;background:var(--field);border-radius:10px;padding:0 12px;display:flex;gap:8px;align-items:center;color:var(--tx3)}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:13px;padding:8px 0;outline:none}
.search input::placeholder{color:var(--tx3)}
.sec{font-size:10.5px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px 4px}
.rows{flex:1;overflow-y:auto;padding:0 8px 8px}
.row{display:grid;grid-template-columns:38px 1fr auto;column-gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;width:100%;background:none;border:0;color:var(--tx);text-align:left}
.row:hover{background:var(--hover)}.row[aria-selected="true"]{background:var(--sel)}
.row .nm{font-weight:600;font-size:13.5px;grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:11px;color:var(--tx3);grid-column:3;font-variant-numeric:tabular-nums}
.row .pv{grid-column:2/4;font-size:12px;color:var(--tx2);min-height:18px;display:flex;align-items:center;gap:8px;min-width:0}
.row .pvt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv.busy{color:var(--ok)}
.row .badge{flex:none;font-size:10px;line-height:16px;background:var(--warn);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
/* 업데이트 게이지 — 단계 전환마다 폭이 늘고, 실행 중에는 옅은 줄무늬가 흐른다 */
.upbar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 6px}
.upbar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--ok);
 transition:width .45s cubic-bezier(.4,0,.2,1)}
.upbar.run>i{background-image:linear-gradient(90deg,transparent 0 35%,rgba(255,255,255,.28) 50%,transparent 65% 100%);
 background-size:200% 100%;animation:upflow 1.1s linear infinite}
@keyframes upflow{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.upbar>i{transition:none}.upbar.run>i{animation:none}}
.uplog{max-height:108px;overflow:auto;background:var(--codeblock);border:1px solid var(--line);
 border-radius:8px;padding:6px 8px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
 color:var(--tx2);white-space:pre-wrap;margin-top:6px}
/* 업데이트가 있으면 설정 버튼에 점을 찍는다 */
.gear.hasup{position:relative}
.gear.hasup::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;
 border-radius:50%;background:var(--warn)}
.ava{width:38px;height:38px;border-radius:50%;position:relative;grid-row:1/3;overflow:hidden;flex:none}
.ava::before{content:"";position:absolute;inset:0;background:var(--c);border-radius:50%}
.ava::after{content:"";position:absolute;width:14px;height:11px;left:12px;top:15px;background:var(--face);border-radius:0 0 7px 7px;opacity:.85}
.ava.two::before{inset:0 8px 8px 0}.ava.two{background:radial-gradient(circle at 70% 70%,var(--c2) 0 45%,transparent 46%)}
.ava .st{position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--sb)}
.ava.sm{width:24px;height:24px;grid-row:auto}.ava.sm::after{width:9px;height:7px;left:7.5px;top:10px}
.ava.lg{width:56px;height:56px;grid-row:auto}.ava.lg::after{width:20px;height:15px;left:18px;top:23px}
.sb-bot{padding:10px 14px 12px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.me{width:26px;height:26px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:10px;font-weight:600}
.sb-bot .u{flex:1;font-size:12.5px;min-width:0}.sb-bot .u small{display:block;color:var(--tx3);font-size:10.5px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{background:none;border:0;color:var(--tx3);font-size:15px;padding:2px 4px}.gear:hover{color:var(--tx)}
/* ── 메인 ── */
.main{display:flex;flex-direction:column;min-width:0;position:relative}
/* ── 로컬 터미널 분할(대화 | ttyd) ── */
.tzone{flex:1;display:flex;min-height:0;min-width:0}
.cpane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tgrip{flex:0 0 5px;cursor:col-resize;background:var(--line);position:relative}
.tgrip:hover,.tgrip.on{background:var(--focus)}
.tshield{position:fixed;inset:0;z-index:9999;cursor:col-resize;background:transparent}
.term{flex:0 0 var(--termw,46%);min-width:280px;display:flex;flex-direction:column;min-height:0;background:#0a0a0a}
.term .tbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #1e1e1e;background:var(--panel)}
.term .tbar .nm{font:11.5px var(--mono);color:var(--tx2);font-weight:600}
.term .tbar .cwd{font:11px var(--mono);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;direction:rtl;text-align:left}
.term .tbar button{background:none;border:1px solid var(--line);color:var(--tx3);border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer}
.term .tbar button:hover{background:var(--hover);color:var(--tx)}
.term iframe{flex:1;width:100%;border:0;background:#0a0a0a;min-height:0}
.term .tmsg{flex:1;display:grid;place-items:center;padding:20px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.7}
.term .tmsg code{background:var(--code);border-radius:4px;padding:1px 5px;font:11.5px var(--mono)}
@media (max-width:900px){.term{display:none}.tgrip{display:none}}
.main.dragover::after{content:"파일을 놓으면 첨부됩니다";position:absolute;inset:8px;border:2px dashed var(--focus);border-radius:14px;display:grid;place-items:center;color:var(--tx2);background:color-mix(in srgb,var(--bg) 75%,transparent);pointer-events:none}
.hd{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);min-height:50px}
.hd b{font-size:13.5px;white-space:nowrap}.hd .sub{color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.hd .sp{flex:1}
.ic{color:var(--tx2);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:none;white-space:nowrap}
.ic:hover{color:var(--tx);background:var(--hover)}.ic[aria-pressed="true"]{color:var(--tx);background:var(--sel)}
.ic:disabled{opacity:.4;cursor:default}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:22px 0;display:flex;flex-direction:column;gap:10px}
.wrap{width:min(720px,94%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.b{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.55;font-size:13.5px;word-break:break-word}
.b.bot{align-self:flex-start;background:var(--bub);border-bottom-left-radius:6px}
.b.user{align-self:flex-end;background:var(--bub-user);border-bottom-right-radius:6px;position:relative;white-space:pre-wrap}
.b .who{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--tx2)}
.b .ts{display:block;font-size:10px;color:var(--tx3);margin-top:4px;font-family:var(--mono)}
.react{position:absolute;right:8px;bottom:-14px;font-size:11px;background:var(--sel);border-radius:999px;padding:1px 7px;font-weight:700}
.react.O{color:var(--ok)}.react.X{color:var(--bad)}.react.T{color:var(--warn)}
.sys{align-self:center;color:var(--tx2);font-size:12px;text-align:center;max-width:90%}
.sys:has(.mr-card){align-self:stretch;max-width:100%;text-align:left}
.sys .tag{color:var(--tx);font-weight:600}
.sys .tm{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-right:6px}
.card{background:var(--bub);border-radius:16px;border-bottom-left-radius:6px;padding:10px;align-self:flex-start;max-width:86%;min-width:min(420px,86%)}
.shot{border-radius:10px;background:var(--shot);border:1px solid var(--shot-line);padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--tx3);line-height:1.7;max-height:190px;overflow-y:auto}
.shot div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot div:last-child{color:var(--tx)}
.cap{font-size:11px;color:var(--tx3);padding:8px 4px 0;display:flex;gap:8px;align-items:center}
.cap .spin{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.b.bot .cur{display:inline-block;width:7px;height:14px;vertical-align:-2px;margin-left:2px;background:var(--tx2);animation:blink .9s infinite}
.comp{padding:10px 18px 16px}
.attach{width:min(720px,94%);margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:6px}
.attach:empty{display:none}
.att{font-family:var(--mono);font-size:11px;color:var(--tx2);background:var(--chip);border-radius:6px;padding:3px 8px;display:flex;gap:6px;align-items:center;max-width:280px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.up{color:var(--tx3);font-style:italic}.att.err{color:var(--bad)}
.att button{background:none;border:0;color:var(--tx3);padding:0;line-height:1}.att button:hover{color:var(--tx)}
.pill{width:min(720px,94%);margin:0 auto;background:var(--pill);border:1px solid var(--line);border-radius:22px;padding:6px 8px 6px 8px;display:flex;align-items:flex-end;gap:8px}
.pill:focus-within{border-color:var(--focus)}
.pill .add{width:28px;height:28px;border-radius:50%;background:var(--sel);border:0;display:grid;place-items:center;color:var(--tx2);font-size:17px;flex:none;margin-bottom:1px}
.pill .add:hover{color:var(--tx)}
.pill textarea{flex:1;resize:none;background:none;border:0;color:var(--tx);font:inherit;font-size:13.5px;line-height:1.45;padding:6px 4px;max-height:140px;min-height:30px;outline:none}
.pill textarea::placeholder{color:var(--tx3)}
.pill .send{height:28px;padding:0 14px;border-radius:14px;border:0;background:var(--pri);color:var(--pri-fg);font-weight:600;font-size:12.5px;flex:none;margin-bottom:1px}
.pill .send:disabled{opacity:.35;cursor:default}
/* 정지 — 글자 대신 네모(■) 하나. 전송과 같은 원형 톤을 유지해 색만 튀지 않게 한다 */
.pill .send.stop{width:28px;padding:0;border-radius:50%;font-size:0;display:inline-flex;align-items:center;justify-content:center}
.pill .send.stop::before{content:'';width:9px;height:9px;border-radius:2px;background:currentColor}
.pill .alt{height:28px;padding:0 12px;border-radius:14px;border:0;background:var(--sel);color:var(--tx);font-size:12px;flex:none;margin-bottom:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--tx2);background:var(--chip);border-radius:999px;padding:4px 11px;border:0;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--pri);color:var(--pri-fg);font-weight:600}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}
.chip:hover{filter:brightness(1.15)}
.qtype{font-size:10.5px;color:var(--tx3);font-family:var(--mono);margin-right:6px}
/* ── 트레이너 문제풀이 모드 ── */
.quiz{width:100%;display:flex;flex-direction:column;gap:12px}
.quiz .prog{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:12px}.quiz .prog .sp{flex:1}
.quiz .qcard{background:var(--bub);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.quiz .qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--tx3);font-family:var(--mono)}
.quiz .qhead .tp{background:var(--chip);color:var(--tx2);border-radius:999px;padding:2px 9px;font-family:inherit;font-weight:600}
.quiz .qbody{font-size:15px;line-height:1.65}
.quiz .fig{margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;overflow-x:auto}
.quiz .fig svg{max-width:100%;height:auto;display:block;margin:0 auto}
.quiz .fig .warn{font-size:11px;color:var(--warn);margin:4px 6px 0}
.quiz .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.quiz .ch{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font:inherit;font-size:13.5px;line-height:1.5;cursor:pointer}
.quiz .ch:hover{border-color:var(--focus)}.quiz .ch[aria-checked="true"]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.quiz .ch.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--field))}.quiz .ch.wrong{border-color:var(--bad);opacity:.6}
.quiz .ch i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--tx2);font-size:11px;font-style:normal;display:grid;place-items:center;font-weight:600}
.quiz textarea.ans{width:100%;min-height:110px;margin-top:14px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font:inherit;font-size:13.5px;line-height:1.55;resize:vertical;outline:none}
.quiz textarea.ans:focus{border-color:var(--focus)}
.quiz .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.quiz .acts button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;background:var(--chip);color:var(--tx2);cursor:pointer}
.quiz .acts button.pri{background:var(--pri);color:var(--pri-fg)}.quiz .acts button:disabled{opacity:.45;cursor:not-allowed}
.quiz .acts .sp{flex:1}.quiz .acts .note{font-size:11px;color:var(--tx3)}
.quiz .hint{margin-top:12px;border-left:3px solid var(--warn);padding:6px 12px;color:var(--tx2);font-size:13px;background:var(--field);border-radius:0 10px 10px 0}
.quiz .res{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--field);border:1px solid var(--line)}
.quiz .res .vd{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;margin-right:8px;color:#fff}
.quiz .res .vd.O{background:var(--ok)}.quiz .res .vd.X{background:var(--bad)}.quiz .res .vd.T{background:var(--warn)}
.quiz .res .outline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--tx2)}
.quiz .empty{text-align:center;color:var(--tx2);padding:40px 0;font-size:13px}
.quiz .spin{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite;margin-right:6px}
.act{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap}
.act button{font-size:12.5px;background:var(--chip);color:var(--tx);border:0;border-radius:999px;padding:6px 14px}
.act button.pri{background:var(--pri);color:var(--pri-fg);font-weight:600}
.act button:disabled{opacity:.4;cursor:default}
.empty{color:var(--tx3);text-align:center;padding:40px 0;font-size:12.5px}
/* 마크다운 */
.md p{margin:4px 0}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:10px 0 4px;line-height:1.4;font-size:14px;font-weight:700}.md h1{font-size:15.5px}
.md code{font-family:var(--mono);font-size:12px;background:var(--code);padding:1px 6px;border-radius:4px}
.md pre{background:var(--codeblock);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto}
.md pre code{background:none;padding:0;font-size:12px;line-height:1.7;white-space:pre}
.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:2px 0}
.md blockquote{border-left:3px solid var(--focus);margin:8px 0;padding:2px 12px;color:var(--tx2)}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}.md th{background:var(--chip)}
.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
/* ── 드로어 ── */
.dr{background:var(--sb);border-left:1px solid var(--line);padding:16px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:16px}
.dr h3{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:0 0 6px;font-weight:600}
.dr .id{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px;text-align:center}

function lastEv(k){var h=evHist[k];return h&&h.length?h[0]:null}
function isRunning(k){var r=RUNS[k];if(r&&r.running)return true;var e=lastEv(k);return !!(e&&Date.now()-e._at<12000)}
function preview(a){
 var e=lastEv(a.key);
 if(a.kind==='proj'){var d=DASH[a.key];
  if(e&&(!d||!d.last||e._at>Date.now()-3600e3))return{t:e.text,tm:e.ts.slice(0,5)};
  if(d&&d.last)return{t:d.last.kind+' — '+stripMd(d.last.msg),tm:d.last.date.slice(0,5)===today()?d.last.date.slice(6):d.last.date.slice(0,5)};
  return{t:'저장된 작업 기록 없음',tm:''}}
 if(e)return{t:e.text,tm:e.ts.slice(0,5)};
 if(a.kind==='fun')return{t:FUN_META[a.key].t+' · '+FUN_META[a.key].sched,tm:''};
 if(a.kind==='cast')return{t:a.desc||'캐스팅 직원',tm:''};
 if(a.kind==='lib'&&window.GR)return GR.preview();
 if(a.kind==='rec'&&window.MR)return MR.preview();
 if(a.kind==='biz')return{t:'팀원 '+(a.members.length?a.members.join(', '):'없음')+(a.goal?' · '+a.goal:''),tm:''};
 return{t:'',tm:''}}
function today(){var d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function stripMd(t){return String(t||'').replace(/```[\s\S]*?```/g,' ').replace(/^#{1,4}\s*/gm,'').replace(/\*\*([^*]*)\*\*/g,'$1').replace(/`([^`]*)`/g,'$1').replace(/[①②③]/g,'').replace(/\s+/g,' ').trim()}
function renderRows(){
 var html='',secs=[['fun','에이전트'],['rec','회의'],['lib','그래프'],['proj','프로젝트'],['cast','캐스팅 직원'],['biz','캐스팅 팀']];
 secs.forEach(function(s){
  var items=ORDER.filter(function(k){return AG[k].kind===s[0]&&(!filter||AG[k].name.toLowerCase().indexOf(filter)>=0)});
  if(!items.length)return;
  if(s[0]!=='fun')html+='<div class="sec">'+s[1]+'</div>';
  items.forEach(function(k){var a=AG[k],pv=preview(a),run=isRunning(k)||(a.kind==='rec'&&window.MR&&MR.recording()),badge='';
   if(k==='tutor'&&QA){var n=0;Object.keys(QA.projects||{}).forEach(function(p){n+=QA.projects[p].pending||0});if(n)badge=n}
   if(a.kind==='biz'&&CASTCAT){var pr=(CASTCAT.projects||[]).filter(function(x){return x.id===a.pid})[0];if(pr&&pr.pending)badge=pr.pending}
   if(a.kind==='lib'&&window.GR){var pc=GR.pendingCount();if(pc)badge=pc}
   html+='<button class="row" data-k="'+esc(k)+'" aria-selected="'+(sel===k&&mode==='chat')+'">'+
    '<span class="ava'+(a.kind==='biz'?' two':'')+(a.kind==='lib'?' gr-ava':'')+'" style="--c:'+a.color+(a.color2?';--c2:'+a.color2:'')+'">'+(a.kind==='lib'?'<i></i><i></i><i></i>':'')+(run?'<span class="st"></span>':'')+'</span>'+
    '<span class="nm">'+esc(a.name)+'</span><span class="tm">'+esc(pv.tm)+'</span>'+
    '<span class="pv'+(run?' busy':'')+'"><span class="pvt">'+esc(pv.t)+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</span></button>'})});
 $('rows').innerHTML=html;
 $('rows').querySelectorAll('.row').forEach(function(b){b.addEventListener('click',function(){open(b.dataset.k)})})}
$('q').addEventListener('input',function(){filter=$('q').value.trim().toLowerCase();renderRows()});

 else if(mode==='map')h='<b>에이전트 오피스</b><span class="sub">실시간 · 워처 5초</span>';

 else if(a){var sub=a.kind==='fun'?FUN_META[a.key].t+' · '+FUN_META[a.key].sched:a.kind==='proj'?a.repo+' · '+a.path:a.kind==='cast'?a.desc:a.kind==='biz'?('캐스팅 팀 · '+(a.members.join(' · ')||'팀원 없음')):a.kind==='lib'&&window.GR?GR.headerSub():a.kind==='rec'&&window.MR?MR.headerSub():'';

 h+='<span class="sp"></span>';
 if(a&&a.kind==='lib'&&mode!=='map'&&mode!=='dash'&&window.GR)h+=GR.headerButtons();
 if(a&&a.kind==='rec'&&mode!=='map'&&mode!=='dash'&&window.MR)h+=MR.headerButtons();
 if(mode==='dash')h+='<button class="ic" id="h-refresh" title="새로고침">↺</button>';
 if(mode==='chat'&&a)h+='<button class="ic" id="h-term" aria-pressed="'+termIsOn(sel)+'" title="로컬 터미널 — '+esc(a.name)+' 폴더에서 tmux 세션을 연다">⌘ 터미널</button>';
 h+='<button class="ic" id="h-map" aria-pressed="'+(mode==='map')+'">에이전트 오피스</button>'+
    '<button class="ic" id="h-dash" aria-pressed="'+(mode==='dash')+'">대시보드</button>';
 if(mode==='map'||mode==='dash'||mode==='home')h+='<button class="ic" id="h-back">← 대화로</button>';
 else h+='<button class="ic" id="h-info" aria-pressed="'+drawerOn+'" title="상세">ⓘ</button>';
 $('hd').innerHTML=h;
 var tb=$('h-term');if(tb)tb.addEventListener('click',function(){toggleTerm()});
 $('h-map').addEventListener('click',function(){setMode(mode==='map'?'chat':'map')});
 $('h-dash').addEventListener('click',function(){setMode(mode==='dash'?'chat':'dash')});
 var b=$('h-back');if(b)b.addEventListener('click',function(){setMode('chat')});
 var i=$('h-info');if(i)i.addEventListener('click',function(){toggleDrawer()});
 var r=$('h-refresh');if(r)r.addEventListener('click',function(){loadDash()});
 if(window.GR)GR.bindHeader();if(window.MR)MR.bindHeader();
 var rb=$('btn-rec');if(rb)rb.setAttribute('aria-pressed',String(!!(window.MR&&MR.recording())))}

function renderMain(){
 renderHeader();
 if(mode.indexOf('gr-')===0){if(AG[sel]&&AG[sel].kind==='lib'&&window.GR)GR.renderMode();else setMode('chat');return}
 if(mode==='map'){$('body').innerHTML='<div class="mapwrap"><canvas id="cv" width="960" height="620" role="img" aria-label="실시간 에이전트 오피스"></canvas>'+
  '<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>작업 중 — 공용 테이블</span><span><i class="dot" style="background:#3a3a3a"></i>대기 — 개인 룸</span><span>캐스팅 직원은 라운지 · 스프라이트를 클릭하면 대화로 이동</span></div></div>';
  mapBind($('cv'));return}
 if(mode==='dash'){$('body').innerHTML='<div class="dash"><div class="dgrid" id="dgrid"></div></div>';renderDash();if(!DASH._ts)loadDash();return}
 if(mode==='home'){renderHome();return}
 if(termIsOn(sel)&&AG[sel]){$('body').innerHTML='<div class="tzone"><div class="cpane" id="cpane"></div><div class="tgrip" id="tgrip"></div><div class="term" id="term" style="--termw:'+termW+'%"></div></div>';bindGrip();renderChat();mountTerm(sel);return}
 // 터미널을 끈 직후엔 #cpane이 아직 DOM에 남아 있다. 비우지 않으면 renderChat()이 chatRoot()로
 // 그 좌측 pane을 다시 잡아 그려서, 우측 iframe이 살아남아 "닫기가 안 먹는" 것처럼 보인다.
 if($('cpane'))$('body').innerHTML='';
 renderChat()}

// ── 로컬 터미널(ttyd + tmux) ──
// 대화 영역을 쪼개 우측에 iframe을 띄운다. 세션은 서버가 에이전트별로 하나씩 유지하므로
// 탭을 옮겼다 돌아와도, 브라우저를 닫았다 열어도 같은 셸에 다시 붙는다.
function chatRoot(){return $('cpane')||$('body')}
function toggleTerm(k){k=k||sel;if(termOn[k])delete termOn[k];else termOn[k]=1;
 try{localStorage.setItem('term',JSON.stringify(termOn))}catch(e){}renderMain()}
function mountTerm(k){
 var el=$('term');if(!el)return;var a=AG[k];
 var cached=termURL[k];
 el.innerHTML='<div class="tbar"><span class="nm">'+esc(a?a.name:k)+'</span><span class="cwd" id="tcwd">…</span>'+
  '<button id="t-close" title="터미널 닫기">×</button></div>'+
  (cached?'':'<div class="tmsg">터미널을 여는 중…</div>');
 bindTermBar(el,k);
 if(cached){paintTerm(el,cached,k);return}
 post('/term/start',{agent:k}).then(function(d){
  if(d.error){el.innerHTML=el.querySelector('.tbar').outerHTML+'<div class="tmsg">'+esc(d.error)+'</div>';bindTermBar(el,k);return}
  termURL[k]=d;if(sel===k&&termIsOn(k))paintTerm(el,d,k)})
 .catch(function(){el.innerHTML=el.querySelector('.tbar').outerHTML+'<div class="tmsg">터미널 서버에 연결할 수 없습니다 — <code>server.py</code> 재시작이 필요할 수 있습니다.</div>';bindTermBar(el,k)})}
function paintTerm(el,d,k){
 var bar=el.querySelector('.tbar');
 el.innerHTML=bar.outerHTML+'<iframe src="'+d.url+'" title="로컬 터미널" allow="clipboard-read; clipboard-write"></iframe>';
 var c=$('tcwd');if(c){c.textContent=d.cwd;c.title=d.session+' · '+d.cwd}
 bindTermBar(el,k)}
// innerHTML 재작성으로 바 리스너가 날아가므로 그릴 때마다 다시 묶는다. 닫기는 해당 에이전트 탭만 끈다.
function bindTermBar(el,k){
 var x=el.querySelector('#t-close');if(x)x.addEventListener('click',function(){toggleTerm(k)})}
// 좌우 폭 드래그 — 비율은 localStorage에 남는다
function bindGrip(){
 var g=$('tgrip');if(!g)return;
 g.addEventListener('pointerdown',function(e){
  if(e.button!==0)return;
  e.preventDefault();g.classList.add('on');
  var zone=g.parentNode;
  // ttyd iframe은 별도 문서라 그 위에서 뗀 mouseup이 부모로 오지 않는다 → 드래그가 안 풀려
  // 클릭 없이도 폭이 따라다니던 버그. 포인터 캡처 + 전면 실드로 이벤트를 부모에 붙잡아 둔다.
  var sh=document.createElement('div');sh.className='tshield';document.body.appendChild(sh);
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  function mv(ev){var r=zone.getBoundingClientRect();var w=(r.right-ev.clientX)/r.width*100;
   termW=Math.max(22,Math.min(72,w));var t=$('term');if(t)t.style.setProperty('--termw',termW+'%')}
  function up(){
   g.classList.remove('on');if(sh.parentNode)sh.remove();
   try{g.releasePointerCapture(e.pointerId)}catch(_){}
   g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
   window.removeEventListener('blur',up);
   try{localStorage.setItem('termw',String(Math.round(termW)))}catch(_){}}
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  window.addEventListener('blur',up)})}

// ── 홈: 오늘 할 일 / 완료 ──
var TODAY=null;
function loadToday(refresh){return fetch('/today'+(refresh?'?refresh=1':''),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){TODAY=d;if(mode==='home')renderHome()}).catch(function(){})}
var ITEMS={};
function itemHtml(x,done){
 var isA=x.kind==='할 일';
 if(x.id)ITEMS[x.id]=x;
 var cls='ti'+(isA?' ta':'')+(done?' done':x.urgent?' urg':'');
 var h='<div class="'+cls+'"'+(x.agent?' data-a="'+esc(x.agent)+'"':'')+(x.id?' data-id="'+esc(x.id)+'"':'')+'>';
 if(isA)h+='<button class="ck'+(done?' on':'')+'" data-ck="'+esc(x.id)+'" data-done="'+(done?1:0)+'" title="'+(done?'완료됨 — 클릭하면 다시 열기':'완료로 표시')+'"></button><span class="pj" title="'+esc(x.project||'')+'">'+esc(x.project||'프로젝트 미정')+'</span>';
 else h+='<span class="k">'+esc(x.kind)+'</span>';
 h+='<span class="t'+(x.source?' lnk':'')+'"'+(x.source?' data-src="'+esc(x.source)+'" title="원본 회의록 열기 — '+esc(x.source)+'"':(isA?' title="원본 문서가 없는 항목"':''))+'>'+esc(x.title)+'</span><span class="s">'+esc(x.sub||'')+(done&&x.done_at?' · 완료 '+esc(x.done_at):'')+'</span></div>';
 return h}
function bindItems(root){
 root.querySelectorAll('.ck[data-ck]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();confirmDone(b.dataset.ck,b.dataset.done==='1',b.closest('.ti').querySelector('.t').textContent)})});
 root.querySelectorAll('.t[data-src]').forEach(function(t){t.addEventListener('click',function(e){e.stopPropagation();fetch('/file?path='+encodeURIComponent(t.dataset.src)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(x){showDoc(t.dataset.src.split('/').pop(),x.text||'(원본 파일이 비어 있습니다 — '+t.dataset.src+')')}).catch(function(){alert('원본을 열 수 없습니다 — '+t.dataset.src)})})});
 root.querySelectorAll('.ti[data-a]').forEach(function(b){b.addEventListener('click',function(){if(b.classList.contains('ta'))return;var k=b.dataset.a;if(AG[k])open(k)})});
 root.querySelectorAll('.ti.ta[data-id]').forEach(function(b){b.addEventListener('contextmenu',function(e){e.preventDefault();itemMenu(e,b)})})}

// ── 할 일 우클릭 메뉴 ──
var CM=null;
function closeCM(){if(CM){CM.remove();CM=null}}
document.addEventListener('click',closeCM);document.addEventListener('scroll',closeCM,true);
window.addEventListener('keydown',function(e){if(e.key==='Escape')closeCM()});
function itemMenu(e,node){
 var x=ITEMS[node.dataset.id];if(!x)return;closeCM();
 var isDone=node.classList.contains('done'),ag=AG[x.agent],who=(x.sub||'').split(' · ')[0];
 var d=document.createElement('div');d.className='cm';
 var h='<div class="hd">'+esc(x.project||'프로젝트 미정')+' · 담당 '+esc(who)+'<br>'+esc((x.title||'').slice(0,54))+(x.title&&x.title.length>54?'…':'')+'</div>';
 h+='<button data-m="fix" class="warn">내 업무가 아님 — '+esc(ag?ag.name:'담당 에이전트')+'에게 기록 수정 요청</button>';
 if(x.source)h+='<button data-m="src">원본 회의록 열기</button>';
 h+='<button data-m="tog">'+(isDone?'다시 열기':'완료로 표시')+'</button>';
 d.innerHTML=h;document.body.appendChild(d);
 var w=d.offsetWidth,ht=d.offsetHeight;
 d.style.left=Math.min(e.clientX,innerWidth-w-8)+'px';d.style.top=Math.min(e.clientY,innerHeight-ht-8)+'px';
 CM=d;
 d.addEventListener('click',function(ev){ev.stopPropagation()});
 d.querySelectorAll('[data-m]').forEach(function(b){b.addEventListener('click',function(){var m=b.dataset.m;closeCM();
  if(m==='src')return openSrc(x.source);
  if(m==='tog')return confirmDone(x.id,isDone,x.title);
  askFix(x)})})}
function openSrc(src){fetch('/file?path='+encodeURIComponent(src)).then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(v){showDoc(src.split('/').pop(),v.text||'(원본 파일이 비어 있습니다 — '+src+')')}).catch(function(){alert('원본을 열 수 없습니다 — '+src)})}
function askFix(x){
 var k=x.agent;if(!AG[k])k='confirm-bot';
 var msg='[할 일 기록 수정 요청]\n'
  +'- id: '+x.id+'\n- 내용: '+x.title+'\n- 현재 담당: '+((x.sub||'').split(' · ')[0]||'미정')
  +'\n- 프로젝트: '+(x.project||'미정')+(x.source?'\n- 출처: '+x.source:'')+'\n\n'
  +'이 할 일은 내 업무가 아니다. 원본 회의록의 할 일 표와 전사 근거를 확인해 실제 담당자를 판정하고, '
  +'그래프의 ASSIGNED_TO를 정정해라(`bash 90-Meta/scripts/graph.sh query`). 근거가 불충분하면 담당을 비우고 '
  +'무엇이 불확실한지 보고해라. 회의록 md의 담당 열도 같이 고치고, 무엇을 어떤 근거로 바꿨는지 알려줘.';
 open(k);
 setTimeout(function(){var inp=$('in');if(!inp)return;inp.value=msg;inp.dispatchEvent(new Event('input'));inp.focus();
  inp.setSelectionRange(msg.length,msg.length);add('sys','할 일 기록 수정 요청을 입력창에 채웠습니다 — 확인 후 Enter로 보내세요')},60)}
function confirmDone(id,isDone,title){
 showModal('<div class="mh"><h2 style="font-size:14px">'+(isDone?'다시 열기':'완료 확인')+'</h2><button class="x">✕</button></div><div class="cfm"><p>'+(isDone?'이 할 일을 다시 열까요?':'이 할 일을 완료하였습니까?')+'</p><div class="q">'+esc(title)+'<br><span style="font-family:var(--mono);font-size:10.5px">'+esc(id)+'</span></div><div class="bt"><button id="cf-no">아니오</button><button class="pri" id="cf-yes">'+(isDone?'예, 다시 열기':'예, 완료')+'</button></div></div>');
 $('cf-no').addEventListener('click',closeModal);
 $('cf-yes').addEventListener('click',function(){var b=$('cf-yes');b.disabled=true;b.textContent='처리 중…';$('cf-no').disabled=true;
  post('/action/done',{id:id,reopen:isDone}).then(function(r){closeModal();if(r&&r.ok===false)throw new Error(r.error||'');patchDone(id,!isDone)}).catch(function(e){closeModal();alert('처리 실패 — '+(e.message||'서버 로그 확인'))})})}

// 완료/재개를 화면에서 제자리 반영한다 — 전체 재집계(/today)를 다시 돌리지 않아 스크롤·펼침 상태가 유지된다.
function localDate(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function regroup(card){
 if(!card)return;
 card.querySelectorAll('.hg').forEach(function(g){
  var n=0,sib=g.nextElementSibling;
  while(sib&&sib.classList.contains('ti')){n++;sib=sib.nextElementSibling}
  if(!n)return g.remove();
  var sp=g.querySelectorAll('span'),lbl=sp[sp.length-1];   // 건수는 항상 마지막 span (앞 span은 프로젝트 배지 또는 그룹명)
  if(lbl)lbl.textContent=n+'건'})}
function patchDone(id,nowDone){
 var it=ITEMS[id];
 if(it){it.status=nowDone?'done':'open';it.done_at=nowDone?localDate():''}
 if(TODAY&&it){                                       // 다음 렌더·폴링과 어긋나지 않게 캐시도 옮긴다
  var from=nowDone?TODAY.todo:TODAY.done,to=nowDone?TODAY.done:TODAY.todo,i=-1;
  from.forEach(function(x,j){if(x.id===id)i=j});
  if(i>=0)to.push(from.splice(i,1)[0]);
 }
 document.querySelectorAll('.ck[data-ck="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]').forEach(function(ck){
  var row=ck.closest('.ti');if(!row)return;

// 전송 버튼은 상태의 투영이다 — 진행 중(job 있음)이면 '정지', 아니면 '전송'.

function add(role,text,o){o=o||{};var w=$('wrap');if(!w)return null;var d=document.createElement('div');

  if(o.verdict){var r=document.createElement('span');r.className='react '+(o.verdict==='O'?'O':o.verdict==='X'?'X':'T');r.textContent=o.verdict;d.appendChild(r)}}
 w.appendChild(d);scrollEnd(o.force);return d}
// 시스템 라인 — 상태에 남겨 탭을 옮겼다 와도 복원한다 (add는 DOM에만 쓴다)

// 멱등이다 — 몇 번 불러도 재생분(data-lv)을 먼저 걷어내고 상태에서 다시 그린다.
// 그래서 renderChat이 body 직후·이력 도착 후 두 번 불러도 중복되지 않고, 이력 조회가 실패해도 카드는 남는다.
function replayLive(k){var w=$('wrap');if(!w)return;

 var s=st(k);
 (s.live||[]).forEach(function(it){var e=add('sys',it.text,it.o);if(e)e.dataset.lv='1'});
 if(s.card){s.card.el=null;var c=mountCard(k);if(c&&c.el)c.el.dataset.lv='1'}
 if(s.stream){s.stream.el=null;mountStream(k);if(s.stream.el)s.stream.el.dataset.lv='1'}}   // 끝난 카드도 다시 세운다

// 진행 카드 — "에이전트의 화면". 줄은 상태(st().card.lines)에 쌓이고 DOM은 그 투영일 뿐이라,
// 다른 탭을 갔다 와도 renderChat → replayLive가 같은 카드를 그대로 다시 세운다.
function mountCard(k){var c=st(k).card;if(!c||!$('wrap')||k!==sel)return c;
 var d=document.createElement('div');d.className='card';
 d.innerHTML='<div class="shot"></div><div class="cap">'+(c.doneAt?'':'<span class="spin"></span>')+esc(c.title)+'의 화면 · '+(c.doneAt?'완료 '+esc(c.doneAt):'작업 중')+'</div>';
 var sh=d.querySelector('.shot');
 c.lines.forEach(function(L){var e=document.createElement('div');e.textContent=L;sh.appendChild(e)});
 $('wrap').appendChild(d);sh.scrollTop=sh.scrollHeight;scrollEnd(true);
 c.el=d;return c}
// 생성 중인 답변 말풍선 — 서버가 흘려보내는 초안(draft)을 그대로 다시 그린다.
// 텍스트는 상태에만 있고 DOM은 투영이라, 탭을 옮겨도 이어서 보인다.
function mountStream(k){var s=st(k),w=$('wrap');if(!s.stream||!w||k!==sel)return;
 if(!s.stream.el||!s.stream.el.isConnected){var d=document.createElement('div');d.className='b bot';
  var m=document.createElement('div');m.className='md';d.appendChild(m);w.appendChild(d);s.stream.el=d}
 s.stream.el.querySelector('.md').innerHTML=md(s.stream.text)+'<span class="cur"></span>';scrollEnd()}
function progressCard(a){var s=st(a.key);s.card={title:a.name,lines:[],doneAt:null,el:null};mountCard(a.key);
 return{line:function(L){var c=s.card;if(!c)return;c.lines.push(L);if(c.lines.length>400)c.lines.shift();
   if(c.el&&c.el.isConnected){var e=document.createElement('div');e.textContent=L;var sh=c.el.querySelector('.shot');
    sh.appendChild(e);sh.scrollTop=sh.scrollHeight;scrollEnd()}},
  draft:function(txt){var s2=st(a.key);
   if(!txt){if(s2.stream&&s2.stream.el&&s2.stream.el.isConnected)s2.stream.el.remove();s2.stream=null;return}
   if(!s2.stream)s2.stream={text:'',el:null};
   if(s2.stream.text===txt)return;s2.stream.text=txt;mountStream(a.key)},
  done:function(){var c=s.card;if(!c||c.doneAt)return;c.doneAt=new Date().toTimeString().slice(0,5);
   if(!c.lines.length){s.card=null;if(c.el&&c.el.isConnected)c.el.remove();return}
   if(c.el&&c.el.isConnected)c.el.querySelector('.cap').innerHTML=esc(c.title)+'의 화면 · 완료 '+c.doneAt}}}
// ── 진행 중인 job의 새로고침 생존 ──
// card/live는 자바스크립트 상태라 새로고침이면 통째로 사라진다. 그래서 "지금 돌고 있는 job id"만
// localStorage에 남겨두고, 부팅 후 /chat/progress?since=0으로 서버에 남아 있는 줄·초안을 되받아
// 진행 카드를 처음부터 다시 세운다. 상태는 서버가 원본, 브라우저는 투영이다.
var LIVE_K='jarvis-live-jobs';
function liveJobs(){try{return JSON.parse(localStorage.getItem(LIVE_K)||'{}')||{}}catch(e){return{}}}
function liveJobSet(k,job){try{var m=liveJobs();
 if(job)m[k]={job:job,ts:Date.now()};else delete m[k];
 localStorage.setItem(LIVE_K,JSON.stringify(m))}catch(e){}}
// 부팅 시 1회. 이미 끝난 job은 답변이 대화 이력에 저장돼 있으니 되살리지 않고 지운다(중복 방지).
function restoreJobs(){var m=liveJobs();Object.keys(m).forEach(function(k){
 var rec=m[k],a=AG[k];
 if(!a||!rec||!rec.job||Date.now()-(rec.ts||0)>3600e3){liveJobSet(k,null);return}
 fetch('/chat/progress?job='+encodeURIComponent(rec.job)+'&since=0',{cache:'no-store'})
  .then(function(r){return r.json()}).then(function(p){
   if(p.done){liveJobSet(k,null);return}          // 서버 재시작으로 job이 없어진 경우도 여기로 온다
   var s=st(k);if(s.busy||s.job)return;           // 같은 탭에서 이미 돌고 있으면 건드리지 않는다
   s.busy=true;
   var card=progressCard(a);
   addLive('새로고침 전 진행 중이던 응답에 다시 연결했습니다',null,k);
   (p.lines||[]).forEach(function(L){card.line(L)});
   if(p.draft)card.draft(p.draft);
   if(s.card&&s.card.el)s.card.el.dataset.lv='1';  // replayLive가 다시 그릴 수 있게 표시
   if(s.stream&&s.stream.el)s.stream.el.dataset.lv='1';
   function finish(reply,pp){s.busy=false;s.job=null;if(sel===k)syncSend();
    if(sel===k)add('bot',reply,{who:a.kind==='cast'||a.kind==='biz'?((pp&&pp.title)||a.name):'',force:true});
    if(a.kind==='biz')renderRows()}
   pollJob(rec.job,card,finish,k,(p.lines||[]).length);
   syncSend();renderRows()}).catch(function(){})})}
function pollJob(job,card,finish,k,seen0){k=k||sel;var s0=st(k);s0.job=job;liveJobSet(k,job);if(k===sel)syncSend();
 function end(){s0.job=null;liveJobSet(k,null);if(k===sel)syncSend()}
 var seen=seen0||0,miss=0,iv=setInterval(function(){
 fetch('/chat/progress?job='+encodeURIComponent(job)+'&since='+seen,{cache:'no-store'}).then(function(r){return r.json()}).then(function(p){miss=0;
  (p.lines||[]).forEach(function(L){card.line(L);seen++});
  if(!p.done)card.draft(p.draft||'');
  if(p.done){clearInterval(iv);end();card.draft('');card.done();finish(p.reply||'(응답 없음)',p)}})
 .catch(function(){if(++miss>25){clearInterval(iv);end();card.draft('');card.done();finish('(연결 오류 — 서버 로그를 확인)')}})},400)}

function callAgent(a){var s=st(a.key);if(s.busy)return;

function send(){
 var a=AG[sel],s=st(sel),inp=$('in'),text=inp.value.trim();
 if(s.busy)return;if(!text&&!ATT.has())return;
 text=ATT.take(text||'첨부한 파일을 확인해 주세요.');
 inp.value='';inp.style.height='auto';
 if(a.kind==='lib'&&window.GR&&GR.chatSend(text)){inp.value='';return}
 // 트레이너: 현재 문제가 있으면 채점, 없으면 일반 대화
 // 캐스팅 팀: 팀원 선택 시 담당 지시, 아니면 팀 토론
 if(a.kind==='biz'&&!s.member){return teamRun(text)}
 s.busy=true;syncSend();
 add('user',text,{force:true});
 var card=progressCard(a);
 var url,body;
 if(a.key==='secretary'){url='/chat';body={text:text}}
 else if(a.kind==='cast'){url='/casting/chat';body={id:a.eid,text:text,async:1}}
 else if(a.kind==='biz'){url='/casting/chat';body={id:s.member,text:text,project:a.pid,async:1}}
 else{url='/agent/chat';body={agent:a.key,text:text}}
 function finish(reply,p){s.busy=false;s.job=null;if(sel===a.key)syncSend();
  if(sel===a.key)add('bot',reply,{who:a.kind==='cast'||a.kind==='biz'?((p&&p.title)||a.name):'',force:true});
  if(a.kind==='biz')renderRows()}
 fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
   if(d.reply){card.done();finish(d.reply,d);return}
   pollJob(d.job,card,finish,a.key)})
  .catch(function(){card.done();finish('(연결 오류 — 서버 로그를 확인)')})}

 var isChoice=Array.isArray(q.choices)&&q.choices.length>1;

 else if(v.fig&&v.fig.svg)h+='<div class="fig">'+v.fig.svg+(v.fig.leak_warning?'<div class="warn">[Minor] 도식에 정답 일부가 노출됐을 수 있습니다 (상위 모델 재시도 후에도 감지됨)</div>':'')+'</div>';

// 진행률 골격을 그리고 폴링을 건다. 서버가 재시작되는 동안 폴링이 끊기므로
// 실패는 무시하고 계속 두드린다 — 다시 붙으면 done 상태를 받아온다.
function startUpdate(force){
 var el=$('m-ver');if(!el)return;
 el.innerHTML='<div class="upbar run" id="m-up-bar"><i style="width:4%"></i></div>'
  +'<p id="m-up-label" style="font-size:11px;color:var(--tx2);margin:0">시작하는 중…</p>'
  +'<div class="uplog" id="m-up-log"></div>';
 post('/api/update',force?{force:1}:{}).then(function(r){
  if(r&&r.ok===false){failUpdate(r.error||'업데이트를 시작하지 못했습니다');return}
  pollUpdate()}).catch(function(){failUpdate('업데이트 요청 실패 — 터미널에서 bash update.sh 를 실행해 주세요')})}

function failUpdate(msg){var el=$('m-ver');if(!el)return;
 el.innerHTML='<p style="color:var(--bad);font-size:12px">'+esc(msg)+'</p>'
  +'<div style="margin-top:8px"><button class="chip" id="m-ver-refresh2">다시 확인</button></div>';
 var rf=$('m-ver-refresh2');if(rf)rf.addEventListener('click',function(){renderVersion(true)})}

function pollUpdate(){
 if(UPD.polling)return; UPD.polling=true;
 var miss=0,iv=setInterval(function(){
  fetch('/api/update/progress',{cache:'no-store'}).then(function(r){return r.json()}).then(function(p){
   miss=0;
   var bar=$('m-up-bar'),lab=$('m-up-label'),log=$('m-up-log');
   if(!bar){clearInterval(iv);UPD.polling=false;return}   // 모달이 닫혔다
   var pct=Math.max(4,Math.round((p.step||0)/(p.total||5)*100));
   bar.firstChild.style.width=pct+'%';
   if(lab)lab.textContent=(p.step||0)+'/'+(p.total||5)+'  '+(p.label||'');
   if(log&&p.lines){log.textContent=p.lines.join('\n');log.scrollTop=log.scrollHeight}
   if(!p.done)return;
   clearInterval(iv);UPD.polling=false;
   var res=p.result||{};
   bar.classList.remove('run');
   if(res.restarting){
    bar.firstChild.style.width='100%';
    if(lab)lab.innerHTML='<span style="color:var(--ok)">업데이트 완료 — 서버 재시작 중. 잠시 후 새로고침합니다.</span>';
    waitForServer();return}
   if(!res.ok){failUpdate(res.error||'업데이트 실패');return}
   if(lab)lab.textContent=res.message||'완료';
  }).catch(function(){
   // 재시작 중에는 연결이 끊긴다. 일정 횟수까지는 정상으로 본다.
   if(++miss>40){clearInterval(iv);UPD.polling=false;failUpdate('서버 응답이 없습니다 — 터미널에서 서버 상태를 확인하세요')}})
 },500)}

// 재시작된 서버가 다시 뜨면 새로고침한다 (고정 대기보다 정확하다).
function waitForServer(){var tries=0;
 var iv=setInterval(function(){tries++;
  fetch('/api/version',{cache:'no-store'}).then(function(r){
   if(!r.ok)throw 0; clearInterval(iv); location.reload()}).catch(function(){
   if(tries>60){clearInterval(iv);var lab=$('m-up-label');
    if(lab)lab.innerHTML='<span style="color:var(--warn)">서버가 자동으로 뜨지 않았습니다. 터미널에서 다시 실행해 주세요.</span>'}})
 },1000)}
